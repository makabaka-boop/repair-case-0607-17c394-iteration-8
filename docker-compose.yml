# 隧道电缆绕孔预检器
# 启动： docker compose up --build
# 验收： docker compose --profile verify run --rm verify
# 宿主端口可覆盖： WEB_PORT=9090 API_PORT=9000 docker compose up --build

services:
  api:
    build:
      context: ./api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health').status==200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ./web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"

  # 一次性验收服务：pytest + 真实请求 Vitest + 前端构建
  # docker compose --profile verify run --rm verify
  verify:
    profiles: ["verify"]
    build:
      context: .
      dockerfile: Dockerfile.verify
    depends_on:
      api:
        condition: service_healthy
    environment:
      VITE_API_BASE: http://api:8000
    restart: "no"
